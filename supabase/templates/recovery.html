<h2>Reset your Sonika password</h2>
<p>Someone asked to reset the password for this Sonika account. If that was you, set a new one here:</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password">Set a new password</a></p>
<p>The link expires in 1 hour and works once. If you didn't ask for this, ignore this email and your password stays the same.</p>
